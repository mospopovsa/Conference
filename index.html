<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Алексей, с днём рождения! :)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Piazzolla:opsz,wght@8..30,400..600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EA; --surface:#F8FAF6; --ink:#1E3328; --muted:#5F7066; --line:#C8D2C4;
  --accent:#B98A1E; --accent-strong:#8F6A12; --danger:#A9432A; --ok:#2F7A4E;
  --serif:"Piazzolla",Georgia,"Times New Roman",serif;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121D17; --surface:#1A2820; --ink:#E6ECE3; --muted:#9EAFA3; --line:#2F4137;
    --accent:#D9A93A; --accent-strong:#F0C25A; --danger:#E07A5F; --ok:#6CC08B;
  }
}
:root[data-theme="dark"]{
  --bg:#121D17; --surface:#1A2820; --ink:#E6ECE3; --muted:#9EAFA3; --line:#2F4137;
  --accent:#D9A93A; --accent-strong:#F0C25A; --danger:#E07A5F; --ok:#6CC08B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
#app{max-width:30rem;margin:0 auto;padding:max(1.5rem,env(safe-area-inset-top)) 1.25rem 3rem}
.screen{display:flex;flex-direction:column;gap:1.5rem;min-height:calc(100dvh - 4.5rem)}
.grow{flex:1}
h1{font:600 2.2rem/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.intro,.lead{color:var(--muted);margin:.75rem 0 0;max-width:34em}
.question{font:500 1.55rem/1.3 var(--serif);margin:0;max-width:26em}
.progress{display:flex;flex-direction:column;gap:.5rem;font-size:.9rem;color:var(--muted)}
.rail{display:flex;gap:4px}
.rail i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.rail i.done{background:var(--accent)}
.rail i.now{background:var(--ink)}
details.hint{margin-top:1rem}
details.hint summary{cursor:pointer;color:var(--muted);font-size:.95rem;width:max-content}
details.hint p{margin:.5rem 0 0;color:var(--muted)}
.entry{display:flex;flex-direction:column;gap:.6rem}
.entry label{font-size:.9rem;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:.5rem;padding:.7rem .8rem;width:100%;margin:0}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.code-input{font:600 1.75rem/1.2 var(--sans);letter-spacing:.18em;text-align:center;padding:.8rem .5rem;border:0;border-bottom:3px solid var(--accent);border-radius:.5rem .5rem 0 0;text-transform:uppercase}
.code-input:focus{outline:none;border-bottom-color:var(--accent-strong);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.code-input.shake{animation:shake .5s}
.msg{min-height:1.4em;margin:0;font-size:.95rem;color:var(--muted)}
.msg.bad{color:var(--danger)}
.ok{color:var(--ok);font-weight:500;margin:0}
.btn{font:500 1.05rem var(--sans);padding:.9rem 1.25rem;border-radius:.6rem;border:1px solid transparent;cursor:pointer;width:100%}
.btn:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-secondary{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:focus-visible,.btn-link:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer}
.foot{margin:auto 0 0;font-size:.9rem;color:var(--muted)}
.foot a{color:inherit}
.banner{background:var(--surface);border:1px dashed var(--accent);padding:.6rem .8rem;border-radius:.5rem;font-size:.9rem;margin:0}
.banner a{color:inherit}
.question a,.intro a,details.hint p a{color:var(--accent-strong);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.15em;overflow-wrap:anywhere}
.reveal{animation:reveal .45s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.reveal,.code-input.shake{animation:none}}
/* builder */
.field{display:flex;flex-direction:column;gap:.35rem}
.field span{font-size:.9rem;color:var(--muted)}
.locs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.25rem}
.loc{border-left:3px solid var(--line);padding-left:1rem;display:flex;flex-direction:column;gap:.75rem}
.loc-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.result{border-top:1px solid var(--line);padding-top:1.25rem;display:flex;flex-direction:column;gap:1rem}
.actions{display:flex;flex-direction:column;gap:.6rem}
.help{color:var(--muted);font-size:.9rem;margin:-.75rem 0 0}
.raw summary{cursor:pointer;color:var(--muted)}
.raw p{color:var(--muted);font-size:.9rem}
.raw code{font-size:.85em}
.raw textarea{font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin-bottom:.6rem}
</style>
</head>
<body>

<script>
(() => {
'use strict';

/* CRYPTO-BEGIN */
const te = new TextEncoder(), td = new TextDecoder();
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const normalizeCode = s => String(s || '').normalize('NFC').toUpperCase().replace(/[\s\-_.]/g, '').replace(/Ё/g, 'Е');
const PBKDF2_ITER = 60000;
async function deriveKey(code, saltB64) {
  const base = await crypto.subtle.importKey('raw', te.encode(normalizeCode(code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations: PBKDF2_ITER },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptStep(obj, code, saltB64) {
  const key = await deriveKey(code, saltB64);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { iv: toB64(iv), ct: toB64(ct) };
}
async function decryptStep(step, code, saltB64) {
  try {
    const key = await deriveKey(code, saltB64);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(step.iv) }, key, fromB64(step.ct));
    return JSON.parse(td.decode(pt));
  } catch (e) { return null; }
}
const newSalt = () => toB64(crypto.getRandomValues(new Uint8Array(16)));
/* CRYPTO-END */

/* DEMO-BEGIN */
const demoDraft = () => ({
  title: 'Демо-квест',
  intro: 'Прочитай загадку, догадайся, о каком месте речь, и найди там записку с кодом. Введи код — откроется следующая загадка.',
  locs: [
    { q: 'Там всегда холодно, но еда от этого только рада. Загляни на нижнюю полку.', hint: 'Оно гудит на кухне.', code: '2741' },
    { q: 'Здесь стоят те, кого давно не открывали, и терпеливо ждут своей очереди.', hint: 'Корешки, страницы, пыль.', code: '8153' },
    { q: 'Оно показывает тебя, но никогда не смотрит в ответ.', hint: 'Висит в прихожей или в ванной.', code: '6099' }
  ],
  final: 'Все записки найдены — квест пройден! Чтобы собрать свой, добавь #builder к адресу этой страницы.',
  admin: 'builder'
});
/* DEMO-END */

const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shortUrl = u => { const t = u.replace(/^https?:\/\//i, ''); return t.length > 44 ? t.slice(0, 40) + '…' : t; };
const link = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>`;
// Экранирует текст и делает ссылки кликабельными: [подпись](https://…) — ссылка с подписью,
// голые http(s):// и www. — сами по себе. Работает по сырому тексту, чтобы не путаться в HTML-сущностях.
const LINK_RE = /\[([^\]\n]+)\]\(((?:https?:\/\/|www\.)[^\s)]+)\)|(^|[\s(«„"'])((?:https?:\/\/|www\.)[^\s<>"'»]+)/gi;
const abs = u => /^www\./i.test(u) ? 'https://' + u : u;
const linkify = raw => {
  let out = '', i = 0, m;
  LINK_RE.lastIndex = 0;
  while ((m = LINK_RE.exec(raw))) {
    out += esc(raw.slice(i, m.index));
    if (m[1]) out += link(abs(m[2]), m[1]);
    else {
      const tail = /[.,;:!?)“”]+$/.exec(m[4]);
      const core = tail ? m[4].slice(0, -tail[0].length) : m[4];
      out += esc(m[3]) + link(abs(core), shortUrl(core)) + esc(tail ? tail[0] : '');
    }
    i = m.index + m[0].length;
  }
  return out + esc(raw.slice(i));
};
const nl = s => linkify(String(s ?? '')).replace(/\n/g, '<br>');
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return (m10 === 1 && m100 !== 11) ? one : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? few : many;
};

let data = (() => { try { return JSON.parse(document.getElementById('quest-data').textContent); } catch (e) { return null; } })();
let testing = false;
const pKey = () => 'quest:progress:' + (data && data.salt);
const hasCrypto = () => !!(window.crypto && crypto.subtle);

// ---------- participant flow ----------

async function restore() {
  const saved = store.get(pKey());
  if (!saved || !Array.isArray(saved.codes)) return { started: false, idx: 0, current: data.start, finalText: null };
  let current = data.start, finalText = null, i = 0;
  for (const code of saved.codes) {
    if (i >= data.steps.length) break;
    const r = await decryptStep(data.steps[i], code, data.salt);
    if (!r) break;
    i++;
    if (r.final !== undefined) { finalText = r.final; break; }
    current = r;
  }
  return { started: true, idx: i, current, finalText };
}

function notice(title, text) {
  return `<section class="screen"><div class="grow"><h1>${esc(title)}</h1><p class="intro">${esc(text)}</p></div>
    <p class="foot"><a href="#builder">Для организатора</a></p></section>`;
}

async function boot() {
  if (!data || !Array.isArray(data.steps) || !data.steps.length) { app.innerHTML = notice('Квест пока пустой', 'Открой раздел для организатора и заполни вопросы.'); return; }
  if (!hasCrypto()) { app.innerHTML = notice('Нужно защищённое соединение', 'Открой страницу по адресу с https:// — иначе браузер не сможет проверять коды.'); return; }
  if (data.title) document.title = data.title;
  const st = await restore();
  if (st.finalText !== null) renderFinal(st.finalText, false);
  else if (st.started) renderPlay(st.idx, st.current, false);
  else renderStart();
}

const adminHref = () => '#' + encodeURIComponent((draft && draft.admin && draft.admin.trim()) || 'builder');
function testBanner() {
  return testing ? `<p class="banner">Режим проверки — квест ещё не сохранён. <a href="${adminHref()}">Вернуться к сборке</a></p>` : '';
}

function renderStart() {
  app.innerHTML = `
  <section class="screen start">
    ${testBanner()}
    <div class="grow">
      <h1>${esc(data.title || 'Квест')}</h1>
      ${data.intro ? `<p class="intro">${nl(data.intro)}</p>` : ''}
    </div>
    <button class="btn btn-primary" id="start">Начать</button>
  </section>`;
  app.querySelector('#start').onclick = () => { store.set(pKey(), { started: true, codes: [] }); renderPlay(0, data.start, true); };
}

function rail(idx, n) {
  return Array.from({ length: n }, (_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'now' : ''}"></i>`).join('');
}

function renderPlay(idx, current, reveal) {
  const n = data.steps.length;
  app.innerHTML = `
  <section class="screen play">
    ${testBanner()}
    <header class="progress"><span>Место ${idx + 1} из ${n}</span><div class="rail" aria-hidden="true">${rail(idx, n)}</div></header>
    <div class="grow${reveal ? ' reveal' : ''}">
      <p class="question">${nl(current.q)}</p>
      ${current.hint ? `<details class="hint"><summary>Подсказка</summary><p>${nl(current.hint)}</p></details>` : ''}
    </div>
    <div class="entry">
      <label for="code">Код с записки</label>
      <input id="code" class="code-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="24">
      <p class="msg" id="msg" role="status"></p>
      <button class="btn btn-primary" id="check">Открыть</button>
    </div>
    <p class="foot"><button class="btn-link" id="reset">Начать сначала</button></p>
  </section>`;
  const input = app.querySelector('#code'), msg = app.querySelector('#msg'), btn = app.querySelector('#check');
  let busy = false;
  async function check() {
    if (busy) return;
    const code = input.value;
    if (!normalizeCode(code)) { msg.textContent = 'Введи код с записки.'; msg.className = 'msg'; input.focus(); return; }
    busy = true; btn.disabled = true; msg.textContent = 'Проверяю…'; msg.className = 'msg';
    const r = await decryptStep(data.steps[idx], code, data.salt);
    busy = false; btn.disabled = false;
    if (!r) {
      msg.textContent = 'Код не подошёл. Проверь записку и попробуй ещё раз.'; msg.className = 'msg bad';
      input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.select();
      return;
    }
    const saved = store.get(pKey()) || { started: true, codes: [] };
    saved.codes = (saved.codes || []).slice(0, idx); saved.codes.push(normalizeCode(code)); store.set(pKey(), saved);
    if (r.final !== undefined) renderFinal(r.final, true); else renderPlay(idx + 1, r, true);
  }
  btn.onclick = check;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  app.querySelector('#reset').onclick = () => { if (confirm('Сбросить прогресс и начать квест сначала?')) { store.del(pKey()); renderStart(); } };
}

function renderFinal(text, reveal) {
  const n = data.steps.length;
  app.innerHTML = `
  <section class="screen final">
    ${testBanner()}
    <header class="progress"><span>Все ${n} ${plural(n, 'место найдено', 'места найдены', 'мест найдены')}</span><div class="rail" aria-hidden="true">${rail(n, n)}</div></header>
    <div class="grow${reveal ? ' reveal' : ''}"><p class="question">${nl(text)}</p></div>
    <p class="foot"><button class="btn-link" id="again">Пройти ещё раз</button></p>
  </section>`;
  app.querySelector('#again').onclick = () => { store.del(pKey()); renderStart(); };
}

// ---------- organizer: builder ----------

const DKEY = 'quest:builder:draft';
let draft = null, built = null, builtHtml = null, saveTimer = null;

function loadDraft() {
  const d = store.get(DKEY);
  if (d && Array.isArray(d.locs) && d.locs.length) {
    return { title: d.title || '', intro: d.intro || '', final: d.final || '', admin: d.admin || 'builder',
      locs: d.locs.map(l => ({ q: l.q || '', hint: l.hint || '', code: l.code || '' })) };
  }
  return demoDraft();
}
function saveDraft() { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set(DKEY, draft), 300); }

function goPlay() { history.replaceState(null, '', location.pathname + location.search); boot(); }

function renderBuilder() {
  draft = loadDraft(); built = null; builtHtml = null;
  app.innerHTML = `
  <section class="screen builder">
    <div>
      <h1>Собрать квест</h1>
      <p class="lead">Первая загадка видна сразу. Каждая следующая зашифрована кодом предыдущего места — без записки её не прочитать даже в исходнике страницы. Ссылки в тексте станут кликабельными; чтобы дать ссылке подпись, пиши [подпись](https://…). Участники этот экран не видят: вход сюда — по секретному адресу, который ты задашь ниже.</p>
    </div>
    <label class="field"><span>Название</span><input id="b-title" value="${esc(draft.title)}"></label>
    <label class="field"><span>Вступление</span><textarea id="b-intro" rows="3">${esc(draft.intro)}</textarea></label>
    <ol class="locs" id="b-locs"></ol>
    <button class="btn btn-secondary" id="b-add">Добавить место</button>
    <label class="field"><span>Финальное сообщение</span><textarea id="b-final" rows="3">${esc(draft.final)}</textarea></label>
    <label class="field"><span>Секретный адрес входа в сборку (то, что после #)</span><input id="b-admin" value="${esc(draft.admin)}" autocomplete="off" spellcheck="false"></label>
    <p class="help">Само слово в файл не попадает — только зашифрованная проверка, по которой его не восстановить. Лучше 10+ знаков; регистр, пробелы и дефисы не важны.</p>
    <button class="btn btn-primary" id="b-build">Собрать квест</button>
    <p class="msg" id="b-msg" role="status"></p>
    <div class="result" id="b-result" hidden>
      <p class="ok" id="b-ok"></p>
      <p class="msg" id="b-entry"></p>
      <div class="actions">
        <button class="btn btn-secondary" id="b-test">Проверить здесь</button>
        <button class="btn btn-primary" id="b-publish" hidden>Опубликовать по этой ссылке</button>
        <button class="btn btn-secondary" id="b-download">Скачать quest.html</button>
      </div>
      <details class="raw"><summary>Данные квеста для ручной вставки в файл</summary>
        <p>Замени содержимое блока <code>&lt;script id="quest-data"&gt;</code> в quest.html на этот текст.</p>
        <textarea id="b-json" rows="6" readonly></textarea>
        <button class="btn btn-secondary" id="b-copy">Скопировать</button>
      </details>
    </div>
    <p class="foot"><a href="#" id="b-back">К квесту</a></p>
  </section>`;
  renderLocs();
  const sec = app.querySelector('.builder');
  const bmsg = app.querySelector('#b-msg');
  const say = (t, bad) => { bmsg.textContent = t; bmsg.className = bad ? 'msg bad' : 'msg'; };

  sec.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset && el.dataset.f !== undefined) { const l = draft.locs[+el.dataset.i]; if (l) l[el.dataset.f] = el.value; }
    else if (el.id === 'b-title') draft.title = el.value;
    else if (el.id === 'b-intro') draft.intro = el.value;
    else if (el.id === 'b-final') draft.final = el.value;
    else if (el.id === 'b-admin') draft.admin = el.value;
    saveDraft();
  });
  sec.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { draft.locs.splice(+rm.dataset.rm, 1); saveDraft(); renderLocs(); }
  });
  app.querySelector('#b-add').onclick = () => {
    draft.locs.push({ q: '', hint: '', code: '' }); saveDraft(); renderLocs();
    const last = app.querySelector('#b-locs li:last-child textarea'); if (last) last.focus();
  };
  app.querySelector('#b-back').onclick = e => { e.preventDefault(); goPlay(); };
  app.querySelector('#b-build').onclick = () => build(say);
  app.querySelector('#b-test').onclick = () => { if (!built) return; data = built; testing = true; store.del(pKey()); goPlay(); };
  app.querySelector('#b-download').onclick = () => download(say);
  app.querySelector('#b-copy').onclick = () => copyJson(say);
  setupPublish(say);
  if (!hasCrypto()) say('Нужен адрес с https:// — иначе браузер не даст зашифровать вопросы.', true);
}

function renderLocs() {
  const ol = app.querySelector('#b-locs');
  if (!ol) return;
  ol.innerHTML = draft.locs.map((l, i) => `
    <li class="loc">
      <div class="loc-head"><span>Место ${i + 1}</span>${draft.locs.length > 1 ? `<button class="btn-link" data-rm="${i}">Убрать</button>` : ''}</div>
      <label class="field"><span>Загадка про место</span><textarea rows="2" data-i="${i}" data-f="q">${esc(l.q)}</textarea></label>
      <label class="field"><span>Подсказка, если застрянут (необязательно)</span><input data-i="${i}" data-f="hint" value="${esc(l.hint)}"></label>
      <label class="field"><span>Код на записке в этом месте</span><input data-i="${i}" data-f="code" value="${esc(l.code)}" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
    </li>`).join('');
}

function composeHtml(obj) {
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML = '';
  clone.querySelector('#quest-data').textContent = '\n' + JSON.stringify(obj).replace(/</g, '\\u003c') + '\n';
  const t = clone.querySelector('title'); if (t && obj.title) t.textContent = obj.title;
  return '<!DOCTYPE html>\n' + clone.outerHTML + '\n';
}

async function build(say) {
  if (!hasCrypto()) { say('Нужен адрес с https:// — иначе браузер не даст зашифровать вопросы.', true); return; }
  const locs = draft.locs;
  const problems = [];
  if (!locs.length) problems.push('Добавь хотя бы одно место.');
  if (!normalizeCode(draft.admin)) problems.push('Укажи секретный адрес входа в сборку.');
  const seen = new Map();
  locs.forEach((l, i) => {
    if (!l.q.trim()) problems.push(`Место ${i + 1}: нет загадки.`);
    const c = normalizeCode(l.code);
    if (!c) problems.push(`Место ${i + 1}: нет кода.`);
    else if (seen.has(c)) problems.push(`Место ${i + 1}: код совпадает с местом ${seen.get(c) + 1}.`);
    seen.set(c, i);
  });
  if (problems.length) { say(problems.join(' '), true); return; }
  say('Шифрую…');
  const salt = newSalt(), steps = [];
  for (let i = 0; i < locs.length; i++) {
    const payload = i < locs.length - 1
      ? { q: locs[i + 1].q.trim(), hint: locs[i + 1].hint.trim() }
      : { final: draft.final.trim() || 'Квест пройден!' };
    steps.push(await encryptStep(payload, locs[i].code, salt));
  }
  const admin = await encryptStep({ builder: true }, draft.admin, salt);
  built = { v: 1, salt, title: draft.title.trim(), intro: draft.intro.trim(), start: { q: locs[0].q.trim(), hint: locs[0].hint.trim() }, steps, admin };
  builtHtml = composeHtml(built);
  say('');
  const result = app.querySelector('#b-result');
  result.hidden = false;
  app.querySelector('#b-ok').textContent = `Готово: ${locs.length} ${plural(locs.length, 'место', 'места', 'мест')}, файл ${(builtHtml.length / 1024).toFixed(0)} КБ.`;
  app.querySelector('#b-entry').textContent = `Вход в сборку после публикации: добавь #${draft.admin.trim()} к адресу страницы. Запомни его — на самой странице он нигде не написан.`;
  app.querySelector('#b-json').value = JSON.stringify(built);
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const hasRuntime = () => !!(window.claude && typeof window.claude.use === 'function');

async function setupPublish(say) {
  if (!hasRuntime()) return;
  let art = null;
  try { art = await window.claude.use('artifact'); } catch (e) { art = null; }
  const btn = app.querySelector('#b-publish');
  if (!art || !btn) return;
  btn.hidden = false;
  btn.onclick = async () => {
    if (!builtHtml) return;
    btn.disabled = true; say('Публикую…');
    try { await art.publish(builtHtml); say('Опубликовано — страница сейчас обновится.'); }
    catch (e) {
      const c = e && e.code;
      say(c === 'not_writer' || c === 'not_granted' ? 'Публиковать может только владелец этой страницы.'
        : c === 'conflict' ? 'Параллельно опубликована другая версия — обнови страницу и повтори.'
        : 'Не удалось опубликовать' + (c ? ': ' + c : '.'), true);
      btn.disabled = false;
    }
  };
}

async function download(say) {
  if (!builtHtml) return;
  if (hasRuntime()) {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { say('Скачивание здесь недоступно — скопируй данные квеста ниже.', true); return; }
    try { await dl.save({ filename: 'quest.html', data: builtHtml }); say('Файл сохранён.'); }
    catch (e) { if (e && e.code === 'declined') say(''); else say('Скачать не удалось — скопируй данные квеста ниже.', true); }
    return;
  }
  const blob = new Blob([builtHtml], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'quest.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function copyJson(say) {
  const ta = app.querySelector('#b-json');
  ta.focus(); ta.select();
  try { await navigator.clipboard.writeText(ta.value); say('Скопировано.'); }
  catch (e) {
    try { if (document.execCommand('copy')) { say('Скопировано.'); return; } } catch (e2) {}
    say('Выдели текст и скопируй вручную.');
  }
}

// ---------- routing ----------

async function isAdminHash(frag) {
  if (!frag) return false;
  if (!data || !data.admin) return normalizeCode(frag) === 'BUILDER';
  if (!hasCrypto()) return false;
  return !!(await decryptStep(data.admin, frag, data.salt));
}
async function route() {
  let frag = location.hash.slice(1);
  try { frag = decodeURIComponent(frag); } catch (e) {}
  if (await isAdminHash(frag)) renderBuilder(); else boot();
}
window.addEventListener('hashchange', route);
route();
})();
